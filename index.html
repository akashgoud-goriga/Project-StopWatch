<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
</head>
<body>
    <main>
        <h1>StopWatch</h1>
        <div class="timers">
            <div id="Hours"></div>
            <div id="Minutes"></div>
            <div id="sec"></div>
            <div id="mc"></div>
        </div>
        <div id="controls">
            <button id="startbtn">Start</button>
            <button id="stopbtn">Stop</button>
            <button id="Resetbtn">Reset</button>
        </div>
    </main>
</body>
</html>
