<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>StopWatch</h1>
        <div class="timers">
            <div >
                <h1 id="Hours">0</h1>
                <p>Hours</p>
            </div>
            <span>:</span>
            <div >
                <h1 id="Minutes">0</h1>
                <p>Minuts</p>

            </div>
            <span>:</span>
            <div >
                <h1 id="sec">0</h1>
                <p>seconds</p>
            </div>
            <span>:</span>
            <div >
                <h1 id="mc">0</h1>
                <p>milliseconds</p>
            </div>
        </div>
        <div id="controls">
            <button id="startbtn">Start</button>
            <button id="stopbtn">Stop</button>
            <button id="Resetbtn">Reset</button>
        </div>
    </main>









    <script src="script.js"></script>
</body>
</html>
